<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Celular · prefectura</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F7; color: #15212C; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 16px; display: flex; flex-direction: column; overflow: hidden">

<header style="background: #15212C; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 10px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Prefectura</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #22313F; color: #9FE0BE"><span style="width: 7px; height: 7px; border-radius: 4px; background: #3BC47E"></span>En vivo</span>
<span style="margin-left: auto; font-size: 14px; color: #C7D1DB">Fuera <strong style="color: #FFFFFF">7</strong> · Fila <strong style="color: #FFFFFF">3</strong></span>
</header>

<div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
<div role="alert" style="background: #FDE9E7; border: 2px solid #C8372D; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 17px; font-weight: 700">Natalia Quiroz · 2°B</span>
<span style="font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 24px; font-weight: 600; color: #A3221A">12:40</span>
</div>
<span style="font-size: 13px; color: #7A1B14">Baño mujeres · sin atender</span>
<div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px">
<button type="button" style="min-height: 48px; border-radius: 12px; border: 1px solid #C8372D; background: #FFFFFF; color: #7A1B14; font-weight: 700; cursor: pointer">Liberar</button>
<button type="button" style="min-height: 48px; border-radius: 12px; border: none; background: #A3221A; color: #FFFFFF; font-weight: 700; cursor: pointer">Yo la atiendo</button>
</div>
</div>

<div role="tablist" aria-label="Lugar" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #E6EBF0; padding: 4px; border-radius: 12px">
<button type="button" role="tab" aria-selected="true" style="min-height: 44px; border-radius: 9px; border: none; background: #FFFFFF; color: #15212C; font-weight: 700; font-size: 14px; cursor: pointer">Hombres 1/1</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 44px; border-radius: 9px; border: none; background: transparent; color: #52606D; font-weight: 700; font-size: 14px; cursor: pointer">Mujeres 3/3</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 44px; border-radius: 9px; border: none; background: transparent; color: #52606D; font-weight: 700; font-size: 14px; cursor: pointer">Enfermería 2</button>
</div>

<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #52606D">DENTRO</span>
<button type="button" style="text-align: left; border-radius: 12px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #15212C; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer">
<span style="display: flex; justify-content: space-between; align-items: center; width: 100%">
<span style="display: flex; flex-direction: column"><span style="font-weight: 700">Pedro Gómez</span><span style="font-size: 13px; color: #52606D">2°B · salió 11:00</span></span>
<span style="font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 22px; font-weight: 600">00:40</span>
</span>
<span style="height: 5px; width: 100%; background: #E6EBF0; border-radius: 3px; overflow: hidden" aria-hidden="true"><span style="display: block; height: 100%; width: 7%; background: #15212C"></span></span>
</button>

<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #8A4B00; padding-top: 4px">FILA</span>
<sc-for list="{{queue}}" as="q" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px; background: #FFFAF0; border: 1px solid #F2D29A">
<span style="width: 28px; height: 28px; border-radius: 14px; background: #FFF0D6; color: #8A4B00; font-weight: 700; display: flex; align-items: center; justify-content: center">{{q.pos}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 700">{{q.name}}</span><span style="font-size: 13px; color: #52606D">{{q.meta}}</span></span>
<span style="font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 14px; color: #8A4B00">{{q.wait}}</span>
</div>
</sc-for>
</div>

<nav aria-label="Secciones" style="margin-top: auto; background: #FFFFFF; border-top: 1px solid #DCE2E8; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<a href="#" style="min-height: 62px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 700; color: #15212C; border-top: 3px solid #1D4E89">En vivo</a>
<a href="#" style="min-height: 62px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 700; color: #52606D; border-top: 3px solid transparent">Historial</a>
<a href="#" style="min-height: 62px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 700; color: #52606D; border-top: 3px solid transparent">Más</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { queue: [
      { pos: 1, name: 'Raúl Herrera', meta: '3°A · Prof. Núñez', wait: '6:10' },
      { pos: 2, name: 'Emiliano Cruz', meta: '1°C · Prof. Lara', wait: '2:05' }
    ] };
  }
}
</script>
</body>
</html>
