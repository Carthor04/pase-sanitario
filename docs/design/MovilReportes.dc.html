<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Celular · reportes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F7; color: #15212C; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 16px; display: flex; flex-direction: column; overflow: hidden">

<header style="background: #FFFFFF; border-bottom: 1px solid #DCE2E8; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Reportes</span>
<span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #FFF0D6; color: #8A4B00">Ejemplo</span>
</div>
<span style="font-size: 14px; color: #52606D">Semana del 12 al 16 de octubre</span>
</header>

<div style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #DCE2E8; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #52606D">{{k.label}}</span>
<span style="font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 24px; font-weight: 600; color: {{k.color}}">{{k.value}}</span>
</div>
</sc-for>
</div>

<div style="background: #FFFFFF; border: 1px solid #DCE2E8; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 700">Baño hombres · salidas por hora</span>
<div style="display: grid; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); gap: 3px">
<span></span>
<sc-for list="{{hours}}" as="h" hint-placeholder-count="7"><span style="font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 10px; color: #52606D; text-align: center">{{h}}</span></sc-for>
<sc-for list="{{heat}}" as="c" hint-placeholder-count="40"><span style="height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 12px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}">{{c.text}}</span></sc-for>
</div>
</div>

<div style="background: #FFFFFF; border: 1px solid #DCE2E8; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 700">Por grupo</span>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px">
<span style="width: 30px; font-weight: 700">{{g.name}}</span>
<span style="flex: 1; height: 8px; background: #EEF1F4; border-radius: 4px; overflow: hidden" aria-hidden="true"><span style="display: block; height: 100%; width: {{g.pct}}; background: #1D4E89"></span></span>
<span style="width: 26px; text-align: right; font-family: 'Atkinson Hyperlegible Mono', monospace">{{g.exits}}</span>
<span style="width: 22px; text-align: center; font-weight: 700; border-radius: 999px; background: {{g.alBg}}; color: {{g.alFg}}">{{g.alerts}}</span>
</div>
</sc-for>
</div>
</div>

<div style="padding: 0 16px 12px">
<button type="button" style="width: 100%; min-height: 52px; border-radius: 12px; border: none; background: #146C43; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Exportar a Google Sheets</button>
</div>

<nav aria-label="Secciones" style="background: #FFFFFF; border-top: 1px solid #DCE2E8; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="#" style="min-height: 62px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 700; color: #52606D; border-top: 3px solid transparent">En vivo</a>
<a href="#" style="min-height: 62px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 700; color: #15212C; border-top: 3px solid #1D4E89">Reportes</a>
<a href="#" style="min-height: 62px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 700; color: #52606D; border-top: 3px solid transparent">Historial</a>
<a href="#" style="min-height: 62px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; font-weight: 700; color: #52606D; border-top: 3px solid transparent">Ajustes</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const kpis = [
      { label: 'SALIDAS', value: '248', color: '#15212C' },
      { label: 'PROMEDIO', value: '5.9 min', color: '#15212C' },
      { label: 'ALERTAS', value: '11', color: '#A3221A' },
      { label: 'FILA MÁX.', value: '5', color: '#8A4B00' }
    ];
    const hours = ['7','8','9','10','11','12','13'];
    const days = ['Lun','Mar','Mié','Jue','Vie'];
    const m = [[3,6,7,11,9,7,5],[4,7,8,13,10,8,4],[2,5,7,12,9,6,5],[3,6,9,12,11,7,6],[2,5,6,10,8,6,3]];
    const mix = (a, b, t) => '#' + [0,2,4].map((i) => Math.round(parseInt(a.slice(1+i,3+i),16)*(1-t) + parseInt(b.slice(1+i,3+i),16)*t).toString(16).padStart(2,'0')).join('');
    const heat = [];
    days.forEach((d, r) => {
      heat.push({ text: d, bg: 'transparent', fg: '#52606D' });
      m[r].forEach((v) => { const t = Math.min(1, v / 12); heat.push({ text: String(v), bg: mix('#EEF3FA', '#1D4E89', t), fg: t > 0.55 ? '#FFFFFF' : '#15212C' }); });
    });
    const g = [['2°B',38,3],['3°A',35,3],['1°C',31,1],['1°B',29,1],['2°C',27,1]];
    const groups = g.map(([name, exits, alerts]) => ({
      name, exits, alerts, pct: Math.round(exits / 38 * 100) + '%',
      alBg: alerts >= 3 ? '#FDE9E7' : '#FFF0D6', alFg: alerts >= 3 ? '#A3221A' : '#8A4B00'
    }));
    return { kpis, hours, heat, groups };
  }
}
</script>
</body>
</html>
